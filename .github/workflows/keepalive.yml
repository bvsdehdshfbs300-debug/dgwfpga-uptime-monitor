name: Keep scheduled monitor active

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record monthly activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .monitor-keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .monitor-keepalive
          git commit -m 'chore: keep uptime monitor active' || exit 0
          git push

